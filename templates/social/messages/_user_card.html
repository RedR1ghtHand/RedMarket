{% load static %}
{% load custom_tags %}

{% for user in thread.participants %}
  {% if user != request.user %}
  <div id="user-card" class="card mb-2 border-0">
    <div class="row g-0 align-items-center">
      <div class="col-auto text-center p-2">
        <img src="https://mc-heads.net/head/{{ user.mc_username }}/128"
             class="img-fluid"
             alt="{{ user.mc_username }}">
      </div>
      <div class="col-auto">
        <div class="card-body py-2 px-3">
          <h5 class="card-title mb-1">{{ user.mc_username }}</h5>
          <p class="card-text mb-2 d-flex align-items-center">
            <span class="me-1">{{ user.reputation_score }}</span>
            <img src="{% static user.reputation_score|rep_icon %}" width="18" alt="Reputation icon">
          </p>
          <div class="d-flex gap-2">
            <button type="button"
                    class="btn btn-sm btn-outline-secondary flex-fill rounded-0"
                    hx-get="{% url 'public_profile' user.mc_username %}"
                    hx-target="#messages-container"
                    hx-push-url="true"
                    hx-swap="outerHTML"
                    hx-headers='{"HX-Request-Partial": "body"}'>
              Orders
            </button>
            <div>
              <form method="post"
                  class="flex-fill"
                  onsubmit="return confirm('Are you sure you want to delete this chat?');">
                {% csrf_token %}
                <button type="submit" name="delete" class="btn btn-sm btn-outline-danger rounded-0 w-100">
                  Delete Chat
                </button>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
