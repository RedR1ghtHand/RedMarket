<div id="thread-container" class="card d-flex flex-column flex-grow-1" style="max-height: 59vh;">
  <!-- MESSAGES -->
  <div class="card-body overflow-auto flex-grow-1 d-flex flex-column-reverse" id="container-chat">
    {% include "social/messages/_messages.html" %}
  </div>

  <!-- CHAT FORM -->
  <form id="chat-form" method="post" class="mt-2 mx-1"
        hx-post="{% url 'thread_detail' thread.id %}"
        hx-target="#thread-container"
        hx-swap="outerHTML"
        hx-headers='{"HX-Request-Partial": "container"}'>
    {% csrf_token %}
    <div class="input-group">
      <textarea id="chat-input" name="content" class="form-control" rows="2" placeholder="Type a message..." required></textarea>
      <button id="chat-send" class="btn btn-primary" type="submit">Send</button>
    </div>
  </form>
</div>
