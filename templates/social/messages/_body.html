<div id="messages-container" class="container" style="margin-top: 3rem; padding-bottom: 2rem;">
  <div class="row" style="height: 70vh;">
    <!-- Sidebar - Threads List -->
    <div class="col-md-3 col-lg-2">
      <div class="card border-0 sh-b h-100">
        <div class="card-header">
          <h6 class="ms-2 mb-0">Conversations</h6>
        </div>
        <div class="card-body p-0" style="height: calc(70vh - 60px);">
          {% include "social/messages/_threads_list.html" %}
        </div>
      </div>
    </div>

    <!-- Main Chat Area -->
    <div class="col-md-9 col-lg-10 sh-b p-0">
      <div class="d-flex flex-column">
        {% include "social/messages/_user_card.html" %}
        {% include "social/messages/_thread_container.html" %}
      </div>
    </div>
  </div>
</div>
