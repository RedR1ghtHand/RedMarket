<div id="thread-container" class="card d-flex flex-column" style="max-height: 57vh;">
  <div class="card-body flex-grow-1 overflow-auto" id="messages">
    {% for msg in messages %}
      <div class="d-flex mb-2 {% if msg.sender == request.user %}justify-content-end{% endif %}">
        <div class="p-2 rounded
                    {% if msg.sender == request.user %}border{% else %}text-white bg-primary border{% endif %}"
             style="max-width:75%;">
          <p class="mb-1">
            {% for user in thread.participants.all %}
              {% if user != request.user and msg.sender == user %}
                <strong>{{ user.username }}</strong><br>
              {% endif %}
            {% endfor %}
            {{ msg.content }}
          </p>
          <small class="text-muted">{{ msg.created_at|date:"d.m, H:i" }}</small>
        </div>
      </div>
    {% endfor %}
  </div>

  <form method="post" class="mt-2"
        hx-post="{% url 'thread_detail' thread.id %}"
        hx-target="#thread-container"
        hx-swap="outerHTML"
        hx-headers='{"HX-Request-Partial": "container"}'>
    {% csrf_token %}
    <div class="input-group">
      <textarea name="content" class="form-control" rows="2" placeholder="Type a message..." required></textarea>
      <button class="btn btn-primary" type="submit">Send</button>
    </div>
  </form>
</div>

<script>
  document.addEventListener("htmx:afterSwap", function(evt) {
    if (evt.detail.target.id === "thread-container") {
      const messagesDiv = document.getElementById("messages");
      if (messagesDiv) {
        messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: "smooth" });
      }
    }
  });
</script>
