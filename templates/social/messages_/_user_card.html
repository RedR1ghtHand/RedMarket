{% load static %}
{% load custom_tags %}

{% for user in thread.participants %}
  {% if user != request.user %}
  <div id="user-card" class="card mb-2 ms-3 border-0 mt-3 align-items-start" style="max-width: 540px;">
    <div class="row align-items-center">
      <!-- Avatar -->
      <div class="col-md-4 text-center p-0">
        <img src="https://mc-heads.net/head/{{ user.mc_username }}/128"
             class="img-fluid"
             alt="{{ user.mc_username }}">
      </div>

      <!-- Info -->
      <div class="col-md-8">
        <div class="card-body ps-0">
          <!-- Username -->
          <h5 class="card-title mb-1">{{ user.mc_username }}</h5>

          <!-- Reputation -->
          <p class="card-text mb-2 d-flex align-items-center">
            <span class="me-1">{{ user.reputation_score }}</span>
            <img src="{% static user.reputation_score|rep_icon %}"
                 width="18"
                 alt="Reputation icon">
          </p>

          <div class="d-flex gap-2">
          <button type="button"
                  class="btn btn-sm btn-outline-secondary flex-fill rounded-0"
                  onclick="location.href='{% url 'public_profile' user.mc_username %}'">
            Orders
          </button>

          <button type="button">
            <form method="post"
              onsubmit="return confirm('Are you sure you want to delete this chat?');">
            {% csrf_token %}
            <button type="submit" name="delete" class="delete-thread-button">❌ Delete</button>
            </form>
          </button>
        </div>

        </div>
      </div>
    </div>
  </div>
  {% endif %}
{% endfor %}
