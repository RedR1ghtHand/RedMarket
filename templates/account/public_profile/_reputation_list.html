{% if reputation_list %}
<div class="card mb-3">
  <div class="card-header">
    <h6 class="mb-0">Reputation History</h6>
  </div>
  <div class="card-body">
    <div class="row">
      {% for rep in reputation_list %}
      <div class="col-md-6 mb-2">
        <div class="d-flex align-items-center p-2 border rounded">
          <div class="me-2">
            {% if rep.is_negative %}
              <span class="text-danger">⚠️</span>
            {% else %}
              <span class="text-success">👍</span>
            {% endif %}
          </div>
          <div class="flex-grow-1">
            <div class="fw-bold">{{ rep.badge|title }}</div>
            <small class="text-muted">
              by {{ rep.giver.mc_username }} • {{ rep.created_at|date:"M d, Y" }}
            </small>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endif %}
