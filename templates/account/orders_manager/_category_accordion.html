<div id="accordion-item-{{ category.id }}" class="accordion-item">
  <h2 class="accordion-header" id="heading-{{ category.id }}">
    <button class="accordion-button show" type="button" data-bs-toggle="collapse"
            data-bs-target="#collapse-{{ category.id }}" aria-expanded="true"
            aria-controls="collapse-{{ category.id }}">
      {{ category.name|capfirst }}
    </button>
  </h2>

  <div id="collapse-{{ category.id }}" class="accordion-collapse collapse show"
       aria-labelledby="heading-{{ category.id }}">
    <div id="accordion-body-{{ category.id }}" class="accordion-body p-2">
      <div class="row row-cols-auto g-1">
        {% for order in orders %}
          {% if order.item_type.category_id == category.id %}
            <div class="col-12 col-md-6 col-lg-4">
              {% include "account/orders_manager/_order_card.html" %}
            </div>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </div>
</div>
