{% load custom_tags %}

<form hx-post="{% url 'select_item_type' %}"
      hx-target="#mainModal .modal-content"
      hx-swap="innerHTML"
      class="p-4 mb-0"
      novalidate>
  {% csrf_token %}
  {% for field in form %}
  <div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    <select name="{{ field.name }}" id="{{ field.id_for_label }}" class="form-select">
      {% for val, label in field.field.choices %}
      <option value="{{ val }}" {% if val == field.value %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
    {% if field.errors %}
    <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
    {% endif %}
  </div>
  {% endfor %}

  <div class="d-flex justify-content-between">
    <span>Search your type to find it quicker</span>
    <button type="submit" class="btn btn-primary">Next</button>
  </div>
</form>
