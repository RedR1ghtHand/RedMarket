{% load custom_tags %}

<form
  hx-post="{% url 'submit_order' %}"
  hx-target="#mainModal .modal-content"
  hx-swap="innerHTML"
  class="p-4"
  novalidate
>
  <h5 class="mb-3">Create Order for: <strong>{{ item_type.name }}</strong></h5>
  {% csrf_token %}
  <input type="hidden" name="item_type_id" value="{{ item_type.id }}" />

  {% for field in form %}
    <div class="mb-3">
      <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
      {{ field|add_class:"form-select" }}
      {% if field.help_text %}
        <div class="form-text">{{ field.help_text }}</div>
      {% endif %}
      {% if field.errors %}
        <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
      {% endif %}
    </div>
  {% endfor %}

  <div class="d-flex justify-content-between">
    <button
      type="button"
      class="btn btn-outline-secondary"
      hx-get="{% url 'select_item_type' %}"
      hx-target="#mainModal .modal-content"
      hx-swap="innerHTML"
    >
      ← Back
    </button>

    <button type="submit" class="btn btn-success">Submit Order</button>
  </div>
</form>
