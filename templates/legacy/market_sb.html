{% load static %}
<div class="mb-3 position-relative" style="margin-top: 10rem; padding-bottom: 8rem;">
  <input id="item-search" type="text"
         class="form-control sh-b rounded-0"
         placeholder="Search Item Type..."
         value="{{ selected_type|default:'' }}"
         autocomplete="off"
         aria-label="Search item type">

  <button type="button" id="clear-btn"
          class="btn position-absolute top-50 end-0 translate-middle-y me-2 d-none"
          aria-label="Clear search">
    &times;
  </button>

  <ul id="suggestions"
      class="list-group position-absolute w-100 mt-1 d-none border rounded-0"
      style="z-index: 1000; max-height: 290px; overflow-y: auto;">
  </ul>
</div>

<script>
  window.itemTypes = {{ enriched_types_json|safe }};
</script>

<script src="{% static 'js/market_search_bar.js' %}"></script>
