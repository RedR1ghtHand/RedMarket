{% load custom_tags %}
{% load static %}

<html lang="en" x-data="{ theme: localStorage.getItem('theme') || 'light' }" :data-bs-theme="theme"
  x-init="$watch('theme', val => localStorage.setItem('theme', val))">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://mc-heads.net">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">

  <link rel="preload" href="{% static 'css/mixin.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <link rel="preload" href="{% static 'css/mc_font.css' %}" as="style" onload="this.onload=null;this.rel='stylesheet'">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/htmx.org@1.9.3"></script>

  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js" defer></script>
  <title>{% block title %}🛒RedMarket{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/mixin.css' %}">
  <link rel="stylesheet" href="{% static 'css/mc_font.css' %}">
</head>

<body id="main" class="d-flex flex-column min-vh-100 mc-font-n" data-user-id="{{ user.id }}">

  {% include "navbar.html" %}

  <div class="pt-navbar">
    <main id="main-content" class="flex-grow-1">
      {% block content %}{% endblock %}
    </main>
  </div>

  <footer class="py-3 mt-auto bg-body-tertiary border-top">
    <div class="container position-relative" x-data>

      <div class="position-absolute top-50 translate-middle-y">
        <div class="d-flex align-items-center gap-2">
          <span :class="theme === 'dark' ? 'text-muted' : 'text-warning'">☀︎</span>

          <div class="form-check form-switch m-0 d-flex justify-content-center">
            <input type="checkbox" class="form-check-input" id="themeToggle" :checked="theme === 'dark'"
              @change="theme = theme === 'dark' ? 'light' : 'dark'">
          </div>

          <span :class="theme === 'dark' ? 'text-light' : 'text-muted'">☾</span>
        </div>
      </div>

      <div class="text-center">
        <small class="text-muted">
          &copy; {{ now.year }} RedMarket. All rights reserved.
        </small>
      </div>

    </div>
  </footer>

  <div id="mainModal" class="modal fade" tabindex="-1" aria-hidden="true" x-init="showMainModal(mainModal)">
    <div class="modal-dialog modal-dialog-centered modal-md">
      <div class="modal-content">
      </div>
    </div>
  </div>
  <script src="{% static 'js/handle_buy.js' %}"></script>
  <script src="{% static 'js/chat_shortcuts.js' %}"></script>
  <script src="{% static 'js/modal_manager.js' %}"></script>
  <script src="{% static 'js/popover_handler.js' %}"></script>
</body>

</html>
